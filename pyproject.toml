[project]
name = "pdiag"
version = "0.0.1"
description = "Open diagnostics for K-line era water-cooled Porsches (986/996/997.1)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
pdiag = "pdiag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
